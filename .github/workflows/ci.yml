name: CI

# Every push to master and every pull request typechecks, builds and runs every check on Linux, macOS and Windows:
# a state runs in a window and in Node on all three. A newer push to the same branch or pull request cancels the
# run before it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # What the package offers is what etc/*.api.md says it is
      - run: npm run api:check
      - run: npm run build
      - run: npm test
