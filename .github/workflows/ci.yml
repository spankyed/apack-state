name: CI

# Every push to master and every pull request typechecks, builds and runs every check on Linux, macOS and Windows:
# a state runs in a window and in Node on all three. A newer push to the same branch or pull request cancels the
# run before it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Nothing here publishes to npm or holds a token for it
      - run: npm run workflows:check
      # Each sibling's packages are named by a release of it, all at one commit, as deps:pin writes them
      - run: npm run deps:check
      - run: npm run lint
      - run: npm run typecheck
      # The oldest TypeScript the package and its type tests are held to
      - run: npm run typecheck:floor
      # What the package offers is what etc/*.api.md says it is
      - run: npm run api:check
      # Each example's graph, read from its types, is what etc/graphs/ says it is
      - run: npm run graph:check
      - run: npm run build
      - run: npm test
      # The package as a consumer gets it: packed, installed into a project of its own, each entry imported
      - run: npm run package:smoke
      # The packed package as published code: its manifest and files (publint), and each entry's types (attw)
      - run: npm run package:lint

  # The kernel's checks in a window: Chromium, through vitest's browser mode and Playwright. Every check that does not
  # need Node itself (elmdb's binding, or a process) runs here as it does in Node.
  browser:
    name: browser (chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # The one check a merge, and the packages workflow, wait on: every suite passed
  ci-pass:
    if: always()
    needs: [suite, browser]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.suite.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
