name: mutants

# Mutation testing of src/ on CI's runners: each job changes one part of it a mutant at a time and runs the specs,
# and fails on a mutant that survived and is not listed in mutants.allowed.json with why; one more job, given every
# report, fails on a listed mutant that survived in none. It runs on a pull request that touches what is mutated or
# what holds it, on master, and by hand.
#
# On master every mutant is run, and each job's results are cached under a key that includes its part and a hash of
# what the specs are run with or written with (which Stryker cannot see). A pull request restores the latest cache
# matching that key and runs again only what its diff can have changed (stryker.config.mjs says which); any change to
# those support files misses the cache and runs everything. What a pull request's run cannot see, master's says after
# the merge, and a failing master opens an issue (the last job).
on:
  push:
    branches: [master]
  pull_request:
    paths: ['src/**', 'checks/**', 'examples/**', 'stryker.config.mjs', 'vitest.config.mts', 'vitest.mutants.mts', 'package.json', 'mutants.allowed.json', 'scripts/mutants.mjs', 'scripts/mutants-names.mjs', '.github/workflows/mutants.yml', 'package-lock.json', 'tsconfig*.json']
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutate:
    name: mutate (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The kernel in four (cut between inner functions so no loop or block straddles a boundary), the last to its
        # end however long it grows, and every other file of src/ in one: a file added to src/ is mutated without
        # being named here.
        include:
          - id: kernel-1-275
            part: 'src/kernel.ts:1-275'
          - id: kernel-276-581
            part: 'src/kernel.ts:276-581'
          - id: kernel-582-821
            part: 'src/kernel.ts:582-821'
          - id: kernel-822-end
            part: 'src/kernel.ts:822-99999'
          - id: other
            part: 'src/**/*.ts,!src/kernel.ts'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keyed by this job's part and everything the specs are run with or written with, other than the spec files
      # themselves (Stryker diffs src/ and each spec file, and sees nothing else). Any change to these support files —
      # on the pull request or on master — misses older caches and runs everything cleanly.
      - name: Cache key
        id: cache
        run: echo "prefix=mutants-${{ matrix.id }}-${{ hashFiles('checks/**', '!checks/*-check.mts', '!checks/rows-property.mts', 'examples/**', 'scripts/mutants.mjs', 'scripts/mutants-names.mjs', 'stryker.config.mjs', 'vitest.*.mts', 'package.json', 'package-lock.json', 'tsconfig*.json', '.github/workflows/mutants.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Results so far
        if: github.event_name == 'pull_request'
        id: restored
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: ${{ steps.cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache.outputs.prefix }}-${{ github.sha }}-
            ${{ steps.cache.outputs.prefix }}-
      - name: Note uncached run
        if: github.event_name == 'pull_request' && steps.restored.outputs.cache-matched-key == ''
        run: |
          echo 'Everything is run: no cached results match these support files.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mutate ${{ matrix.part }}
        run: npx stryker run --incremental ${{ github.event_name != 'pull_request' && '--force' || '' }}
        env:
          MUTATE: ${{ matrix.part }}
      # Stryker carries over cached mutants whose diff-shifted lines fall outside MUTATE; drop them so lines moving
      # across shard boundaries never leave phantom results in this job's report or cache. On a forced full run
      # (master / dispatch) every mutant must already be in scope, so --expect-none verifies the prune agrees with Stryker.
      - name: Drop mutants outside this job's part
        id: prune
        run: node scripts/mutants.mjs --prune ${{ github.event_name != 'pull_request' && '--expect-none' || '' }} "$MUTATE" reports/mutation/mutation.json reports/stryker-incremental.json
        env:
          MUTATE: ${{ matrix.part }}
      - name: Keep these results
        id: saved
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: ${{ steps.cache.outputs.prefix }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Note unsaved cache
        if: steps.saved.outcome == 'failure'
        run: |
          echo 'Warning: failed to save incremental cache; subsequent PR runs will not reuse these results.' >> "$GITHUB_STEP_SUMMARY"
      - name: What survived
        if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        run: node scripts/mutants.mjs reports/mutation/mutation.json "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.id }}
          path: reports/mutation/mutation.json
          if-no-files-found: ignore

  # A listed mutant that survived in no job is taken off the list. Only all the reports together can say so: a job
  # mutates part of a file, and the same line as written can be in another job's part.
  listed:
    name: every listed mutant still survives
    needs: mutate
    # After the jobs, whatever they did, unless the run was called off: the run that called it off says it instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: reports
      - name: Listed, and still surviving
        run: |
          test "$(ls reports/*/mutation.json | wc -l)" -eq 5 || { echo 'A job left no report, so the list cannot be checked'; exit 1; }
          node scripts/mutants.mjs --all "$GITHUB_STEP_SUMMARY" reports/*/mutation.json

  # Master's result, said where it is seen (.github/scripts/master-status.sh)
  master:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [mutate, listed]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/master-status.sh ${{ (needs.mutate.result == 'success' && needs.listed.result == 'success') && 'passed' || 'failed' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
